<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101820">
  <title>Three-Player Browser Game</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #101820; color: #f2f5f7; }
    body { min-height: 100svh; margin: 0; display: grid; place-items: center; }
    main { width: min(42rem, calc(100% - 3rem)); padding: 2rem; border: 1px solid #35424d; border-radius: 1rem; background: #18232d; }
    h1 { margin-top: 0; font-size: clamp(1.8rem, 5vw, 2.8rem); }
    p { color: #c3cdd5; line-height: 1.6; }
    .status { display: inline-block; padding: .35rem .7rem; border-radius: 99px; background: #254b3f; color: #c4f5dc; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <span class="status">Infrastructure setup</span>
    <h1>Your three-player game starts here</h1>
    <p>This starter page is ready for browser hosting. The game rules and visuals will be added after you choose the kind of game you want.</p>
    <p>Next: connect hosting, then add shared saves and multiplayer.</p>
  </main>
</body>
</html>
